    <!-- Fix GitHub Pages project relative pathing (guarantee trailing slash and SPA route restoration) -->
    <script>
      (function(l) {
        // Guarantee trailing slash for GitHub Pages repo root
        if (
          l.hostname.includes('github.io') &&
          l.pathname &&
          !l.pathname.endsWith('/') &&
          !l.pathname.includes('.')
        ) {
          l.replace(l.pathname + '/' + l.search + l.hash);
          return;
        }

        // Restore clean URL if redirected by 404.html
        if (l.search && l.search.indexOf('p=/') > -1) {
          var pMatch = l.search.match(/p=\/([^&]*)/);
          var restoredPath = pMatch ? '/' + decodeURIComponent(pMatch[1]) : '';
          var qMatch = l.search.match(/&q=([^&]*)/);
          var actualSearch = qMatch ? '?' + decodeURIComponent(qMatch[1]) : '';
          window.history.replaceState(null, null,
            l.pathname.replace(/\/$/, '') + restoredPath + actualSearch + l.hash
          );
        }
      }(window.location));
    </script>
